tagline = "a sound caught in three rings and scanned"
repo = "https://github.com/Savageperson334/strata-fm1"
licence = "MPL-2.0"
author = "Savageperson334"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
description = "MORPH makes a sound, REC catches it in one of three rings, the rings are scanned. A key strikes a note exactly one ring long (1.49 s), its hidden envelopes carrying it to its mirror image and back. Each ring has a head and grains: POSITION scrubs, SIZE and DENSITY make grains or the plain recording, PITCH transposes, SPEED runs it backward, freezes or doubles it. The keys slice a ring into 16 places or transpose it. A ring can be resampled from the others. Hold GLO for a guide."
tags = ["synth", "sampler"]
install = "https://savageperson334.github.io/strata-fm1/palindrome/install/"
