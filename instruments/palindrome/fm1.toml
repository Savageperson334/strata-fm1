description = "MORPH blends four ways of making sound with two knobs. SILT records the result into a loop and plays it back in grains, forward and backward; freeze, overdub and resample it, and hold REC to record noise, crush and dropouts in or gate hiss out. The screen is a picture of the engine: the loop as a ring, the grains riding it."
