credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
description = "A sound, looped, and made again from itself. Tap a key: MORPH (four ways of making sound, struck and dying away) plays a note, it is caught as a ring of 1.49 s, and SILT loops it with up to 16 grains. DRIFT then makes the loop again from itself, generation after generation, each kept at the same loudness: off it is stable, up it changes faster. Three rings are kept; the keys transpose them; record effects add noise, crush and dropouts. One press per page; hold GLO for a guide on the screen."
tags = ["synth", "sampler"]
install = "https://savageperson334.github.io/strata-fm1/palindrome/install/"
