credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
description = "SILT is the instrument: up to 16 grains from the selected ring, played from the keys as an arpeggio or a chord. MORPH is the injector: four ways of making sound blended with two knobs. One press of REC captures a new ring (three of 1.49 s), from MORPH or from SILT's own grains, and never overwrites an older one; each ring keeps its own settings, and the record effects add noise, crush and dropouts. One press per page, nothing held. The screen shows the rings as concentric circles."
tags = ["synth", "sampler"]
