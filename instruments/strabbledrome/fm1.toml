# STRABBLEDROME: STRATA, PALINDROME and BabbleBeat behind one menu, one of them running at a time.
# Each instrument is its own unchanged source, compiled as a unit of its own (engines/); STRATA's buffers and
# PALINDROME's rings share one workspace.
id_prefix = "FM-1_61"      # package identity: dev FM-1_6100, releases FM-1_61XXYYZZ
name = "STRABBLEDROME"
usb_manufacturer = "STRABBLEDROME"
usb_product = "STRABBLEDROME FM-1"
include = ["../../app/dsp", "../palindrome/dsp", "../babblebeat/lang", "../babblebeat/dsp"]
o2 = ["engines/strata.c", "engines/palindrome.c", "engines/babblebeat.c",
      "engines/strata_dsp.c", "engines/palindrome_dsp.c", "engines/babble_lang.c", "engines/babble_voice.c"]
o2_cflags = ["-DFM1_WORKSPACE=sdr_workspace"]
emu = ["midi"]
tagline = "STRATA, PALINDROME and BabbleBeat behind one menu"
repo = "https://github.com/Savageperson334/strata-fm1"
licence = "MPL-2.0"
author = "Savageperson334"
install = "https://savageperson334.github.io/strata-fm1/strabbledrome/install/"
site = "https://savageperson334.github.io/strata-fm1/strabbledrome/"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
description = "STRATA, PALINDROME and BabbleBeat in one firmware. One press of GLO opens the menu; SELECT chooses, SEL opens, GLO or HOME goes back. One instrument runs at a time, and a change starts the other afresh. In an instrument every other control is its own."
tags = ["synth", "sampler", "experimental"]
screenshot = "docs/img/menu.png"
