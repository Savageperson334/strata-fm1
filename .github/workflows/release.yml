# SPDX-License-Identifier: MPL-2.0
# STRATA's release: a pushed tag vX.Y builds the firmware from source on GitHub with the shared FM-1 builder, runs
# the tests (a failing test stops it), signs the package with build provenance, publishes the release, and then
# publishes the site with the web installer on GitHub Pages (the gh-pages branch).
# From fm1-base's template workflow (as LOOM-8's, CTL-1's), with the site job added.
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strata-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: STRATA
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # (the versions base/tools/build.py --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=strata
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/)
        git submodule update --init --recursive
        # the fonts' OpenType features (base/tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
          # (the tests check the update path against app/build/$pkg.fwsc: there, the release package itself)
          cp "app/build/$pkg-$version.fwsc" "app/build/$pkg.fwsc"
        else
          ./build.sh
          cp "app/build/$pkg.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
        fi
        cp app/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        pkg=strata
        [ -f "app/build/$pkg.fwsc" ]
        sh tests/run_tests.sh
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin build/release-assets/firmware.json; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # The site: the front page, the one-click installer (Chrome or Edge, Web MIDI) with the attested package, the
  # manual with screenshots from the simulator, and the firmware playable in the browser.
  site:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow (with raqm, for the fonts)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libfribidi0
          python3 -m pip install -q Pillow
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
      - name: Emscripten (the browser version), a fixed version from emsdk
        run: |
          set -euo pipefail
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Build the site
        run: |
          set -euo pipefail
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          version=${GITHUB_REF_NAME#v}
          pkg=$(ls build/attested/build/release-assets/strata-*.fwsc | grep -v -- '-app' | head -1)
          # the manual's screenshots from the simulator (the real screen)
          ./build.sh --host
          app/build/host/strata_host app/tests/screens.txt app/docs/img
          ./build.sh --web
          python3 base/tools/make_site.py app "$pkg" "$version" "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
