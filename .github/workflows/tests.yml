# SPDX-License-Identifier: MPL-2.0
# STRATA's and PALINDROME's tests on every push: the sound engine, the app logic and the whole firmware in fm1-base's simulator
# (no JieLi toolchain needed). The firmware itself is built by release.yml when VERSION changes.
name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write                        # (the screenshots go to the ci-shots branch, to look at before a release)

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow (with raqm, for the fonts)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libfribidi0
          python3 -m pip install -q Pillow
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
      - name: Tests
        run: sh tests/run_tests.sh
      - name: PALINDROME's tests (the engine alone, then the whole firmware in the simulator)
        run: |
          set -euo pipefail
          p=instruments/palindrome
          cc -O2 -DPLAT_HOST -Ibase/include -I"$p/dsp" "$p/tests/dsp.c" "$p/dsp/palindrome.c" -lm -o /tmp/pm-test
          /tmp/pm-test
          # the FM-1's toolchain has no C library headers: none may be included outside the simulator's part
          if grep -nE '#include <(string|stdlib|stdio|math)\.h>' "$p/app.c" "$p/app.h" "$p"/dsp/*.[ch]; then exit 1; fi
          python3 base/tools/build.py "$p" --host
          mkdir -p shots/palindrome
          "$p/build/host/palindrome_host" "$p/tests/basic.txt" shots/palindrome
      - name: BabbleBeat grammar, voice and host simulator tests
        run: |
          set -euo pipefail
          p=instruments/babblebeat
          cc -O2 -I"$p/lang" "$p/tests/lang.c" "$p/lang/babble_lang.c" -o /tmp/bb-lang
          /tmp/bb-lang
          cc -O2 -Ibase/include -I"$p/lang" -I"$p/dsp" "$p/tests/voice.c" "$p/lang/babble_lang.c" "$p/dsp/babble_voice.c" -lm -o /tmp/bb-voice
          /tmp/bb-voice
          # The embedded toolchain has no standard C library headers.
          if grep -nE '#include <(string|stdlib|stdio|math)\.h>' "$p/app.c" "$p/app.h" "$p"/dsp/*.[ch] "$p"/lang/*.[ch]; then exit 1; fi
          python3 base/tools/build.py "$p" --host
          mkdir -p shots/babblebeat
          "$p/build/host/babblebeat_host" "$p/tests/basic.txt" shots/babblebeat
      - name: Screenshots and the drone, for a look
        if: always()
        run: |
          mkdir -p shots
          app/build/host/strata_host app/tests/screens.txt shots || true
          cp app/build/scenarios/basic/*.png app/build/scenarios/basic/*.wav shots/ 2>/dev/null || true
          cp app/build/tests/*.wav shots/ 2>/dev/null || true
          for f in shots/palindrome/*.png; do [ -f "$f" ] && mv "$f" "shots/palindrome-$(basename "$f")"; done || true
      - name: The screenshots to the ci-shots branch
        if: always()
        run: |
          set -euo pipefail
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screens from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots || echo "another run pushed its screens at the same moment: left as they are"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-test-output
          path: |
            shots/
            app/build/tests/*.log
