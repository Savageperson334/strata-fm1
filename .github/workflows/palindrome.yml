name: PALINDROME
on:
  push:
    branches: [main]
    paths: ['instruments/palindrome/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: palindrome-build
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent release tag
        id: version
        run: |
          set -euo pipefail
          version=$(tr -d ' \r\n' < instruments/palindrome/VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/palindrome-v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependencies
        run: |
          sudo apt-get install -y -qq libfribidi0 rsync
          python3 -m pip install -q Pillow
      - name: DSP tests and panel simulator
        run: |
          set -euo pipefail
          p=instruments/palindrome
          cc -O2 -DPLAT_HOST -Ibase/include -I"$p/dsp" "$p/tests/dsp.c" "$p/dsp/palindrome.c" -lm -o /tmp/pm-test
          /tmp/pm-test
          python3 base/tools/build.py "$p" --host
          mkdir -p "$p/docs/img"
          "$p/build/host/palindrome_host" "$p/tests/basic.txt" "$p/docs/img"
      - name: Build browser emulator
        run: |
          set -euo pipefail
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          python3 base/tools/build.py instruments/palindrome --web
      - name: Publish playable development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p=instruments/palindrome
          mkdir -p "$RUNNER_TEMP/preview"
          cp -r "$p/build/emu" "$RUNNER_TEMP/preview/emu"
          cp "$p/docs/MANUAL.md" "$RUNNER_TEMP/preview/manual.md"
          cp -r "$p/docs/img" "$RUNNER_TEMP/preview/img"
          cp -r base/web/fonts "$RUNNER_TEMP/preview/fonts"
          cat > "$RUNNER_TEMP/preview/index.html" <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALINDROME — experimental FM-1 instrument</title><style>body{background:#151420;color:#eadff7;font:18px system-ui;max-width:650px;margin:5rem auto;padding:1.5rem}a{color:#c7a6fa}img{max-width:46%;margin:1%}h1{letter-spacing:.08em}small{color:#c4b6d0}</style><main><a href="../">← STRATA / instruments</a><h1>PALINDROME</h1><p>Make sound. Capture it. Scatter it. Write over it.</p><p><a href="emu/">Play the PALINDROME emulator</a> · <a href="manual.md">Controls</a></p><p><img src="img/morph.png" alt="MORPH: the square lit"><img src="img/silt.png" alt="SILT: the ring lit"></p><p>FX: MORPH. EDIT: SILT. REC: capture mode. PLAY: grains. SEL: more. Hold HOME to clear. Start by playing notes and freezing the memory.</p><small>Development preview — browser audio uses the same C DSP as the FM-1. Hardware release is built separately.</small></main></html>
          HTML
          # Do not replace a published installer, manual and emulator with a preview: once any PALINDROME release
          # exists, the site changes only when the release job below publishes the next one whole.
          version=$(tr -d ' \r\n' < "$p/VERSION")
          if [ "${{ steps.version.outputs.released }}" = true ]; then
            # This version is already released (a change to the manual, the site or the scripts): the whole site
            # again, with the released package.
            mkdir -p "$RUNNER_TEMP/pal-release"
            gh release download "palindrome-v$version" --pattern 'palindrome-*.fwsc' --dir "$RUNNER_TEMP/pal-release"
            python3 base/tools/make_site.py "$p" "$RUNNER_TEMP/pal-release/palindrome-$version.fwsc" "$version" "$RUNNER_TEMP/pal-site"
            bash scripts/publish-instrument-site.sh "$RUNNER_TEMP/pal-site" palindrome
          elif [ -n "$(git ls-remote --tags origin 'refs/tags/palindrome-v*')" ]; then
            echo "A PALINDROME release exists; leave its site intact until the next release is published."
          else
            bash scripts/publish-instrument-site.sh "$RUNNER_TEMP/preview" palindrome
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: palindrome-preview
          path: |
            instruments/palindrome/build/emu/
            instruments/palindrome/docs/img/
  firmware:
    needs: preview
    if: needs.preview.outputs.released == 'false'
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        p=instruments/palindrome
        python3 base/tools/build.py "$p" --host
        mkdir -p "$p/docs/img" build/release-assets
        "$p/build/host/palindrome_host" "$p/tests/basic.txt" "$p/docs/img"
        version=$(tr -d ' \r\n' < "$p/VERSION")
        python3 base/tools/build.py "$p" --release "$version"
        cp "$p/build/palindrome-$version.fwsc" build/release-assets/
        cp "$p/build/palindrome.bin" "build/release-assets/palindrome-$version-app.bin"
        cp "$p/build/firmware.json" build/release-assets/
      test: |
        set -euo pipefail
        p=instruments/palindrome
        cc -O2 -DPLAT_HOST -Ibase/include -I"$p/dsp" "$p/tests/dsp.c" "$p/dsp/palindrome.c" -lm -o /tmp/pm-test
        /tmp/pm-test
        "$p/build/host/palindrome_host" "$p/tests/basic.txt" "$p/docs/img"
      packages: build/release-assets/*
  release:
    needs: [preview, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - uses: actions/download-artifact@v4
        with:
          name: palindrome-preview
          path: instruments/palindrome
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and publish independent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/attested
          sha256sum --check SHA256SUMS
          for f in build/release-assets/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow zvenson/fm1-build/.github/workflows/build.yml --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
          version=$(tr -d ' \r\n' < ../../instruments/palindrome/VERSION)
          if ! gh release view "palindrome-v$version" >/dev/null 2>&1; then
            gh release create "palindrome-v$version" --target "$GITHUB_SHA" --title "PALINDROME $version (experimental)" --prerelease --latest=false --notes "Experimental alternative FM-1 instrument. Hardware validation pending; try the emulator first." build/release-assets/* SHA256SUMS
          fi
      - name: Generate full installer and emulator website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p=instruments/palindrome
          version=$(tr -d ' \r\n' < "$p/VERSION")
          mkdir -p "$RUNNER_TEMP/pal-release"
          # Download the actual tagged package, including on reruns.
          gh release download "palindrome-v$version" --pattern 'palindrome-*.fwsc' --dir "$RUNNER_TEMP/pal-release"
          pkg="$RUNNER_TEMP/pal-release/palindrome-$version.fwsc"
          sudo apt-get install -y -qq rsync
          python3 -m pip install -q Pillow
          python3 base/tools/make_site.py "$p" "$pkg" "$version" "$RUNNER_TEMP/pal-site"
          bash scripts/publish-instrument-site.sh "$RUNNER_TEMP/pal-site" palindrome
